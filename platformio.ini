[env:custom_rp2350b]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = rpipico2
framework = arduino
board_build.core = earlephilhower

lib_deps = 
    adafruit/Adafruit AS7343@^1.0.0
    adafruit/Adafruit BusIO@^1.14.0
; --- Custom Hardware Overrides for RP2350B ---
; Change these settings to match your custom board's physical layout, 
; flash size, and core architecture (ARM Cortex-M33 or Hazard3 RISC-V).

; 1. Select the CPU core architecture: "arm" (Cortex-M33) or "riscv" (Hazard3)
board_build.mcu = rp2350
board_build.arp2350_core = arm 

; 2. Define your flash memory size in megabytes (e.g., 2m, 4m, 8m, 16m)
board_upload.maximum_size = 4194304 

; 3. Clock speed (default is usually 150MHz for RP2350)
board_build.f_cpu = 150000000L

; Serial Monitor Options
monitor_speed = 115200

board_build.filesystem_size = 0.5m